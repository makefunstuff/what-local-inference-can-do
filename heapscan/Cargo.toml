[package]
name = "heapscan"
version = "0.1.0"
edition = "2021"
description = "Cross-platform (macOS + Linux) CLI that discovers a process heap by PID, dumps interesting heap objects as JSON, and writes payloads into heap objects"

[[bin]]
name = "heapscan"
path = "src/main.rs"

[[bin]]
name = "demo-target"
path = "src/demo_target.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
